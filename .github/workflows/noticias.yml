name: Robot de noticias

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node robot-noticias.js
      - name: Guardar si hay noticias nuevas
        run: |
          git config user.name "Robot Vibras Positivas HM"
          git config user.email "robot@vibraspositivashm.com"
          git add data/noticias.json
          git diff --staged --quiet || (git commit -m "Noticias $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')" && git push)

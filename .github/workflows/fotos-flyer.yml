name: Bajar fotos del flyer
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p flyer
          node -e "
          const d=require('./data/noticias.json');
          const l=[['alpujarra',d.fotos.alpujarra&&d.fotos.alpujarra.original],['medellin',d.fotos.medellin&&d.fotos.medellin.imagen],['fiscalia',d.fotos.fiscalia&&d.fotos.fiscalia.imagen]];
          d.videos.slice(0,3).forEach((v,i)=>l.push(['video'+(i+1),'https://i.ytimg.com/vi/'+v.id+'/hqdefault.jpg']));
          d.items.filter(x=>x.imagen).slice(0,3).forEach((n,i)=>l.push(['noticia'+(i+1),n.imagen.replace('http://','https://')]));
          require('fs').writeFileSync('flyer/lista.txt',l.filter(x=>x[1]).map(x=>x[0]+' '+x[1]).join('\n'));"
          while read n u; do curl -sfL -A "Mozilla/5.0 VibrasPositivasHM" -o "flyer/$n.jpg" "$u" || echo "fallo $n"; done < flyer/lista.txt
          ls -la flyer
      - run: |
          git config user.name "Robot Vibras Positivas HM"
          git config user.email "robot@vibraspositivashm.com"
          git add flyer && git commit -m "Fotos reales para el flyer" && git pull --rebase && git push
